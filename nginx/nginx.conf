events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile on;

  upstream gateways {
    least_conn;
    # Docker DNS round-robins the "gateway" service to all replicas; we list it
    # multiple times so Nginx keeps multiple upstream slots with health tracking.
    server gateway:8081 max_fails=3 fail_timeout=10s;
  }

  server {
    listen 80;

    # Static client
    location / {
      root /usr/share/nginx/html;
      index index.html;
      try_files $uri $uri/ /index.html;
    }

    # REST API → gateways (load balanced, with failover)
    location /api/ {
      proxy_pass http://gateways;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_connect_timeout 2s;
      proxy_read_timeout 30s;
    }
  }
}
